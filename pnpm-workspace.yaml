packages:
  - "apps/*"
  - "packages/*"
  # The phone app has its own toolchain (Expo, bun); see apps/mobile/README.md.
  - "!apps/mobile"

# Dependencies whose install scripts may run. ssh2 works without its optional native crypto addon.
allowBuilds:
  esbuild: true
  workerd: true
  ssh2: false
  cpu-features: false

# rolldown's wasm binding pins the 2.0 beta of emnapi; mixed with 1.x it crashes `astro check`.
overrides:
  "@emnapi/core": ^1.11.3
  "@emnapi/runtime": ^1.11.3
