      (function () {
        const tl = gsap.timeline({ paused: true });
        const D = 10.5;

        tl.fromTo("#s8-sky", { opacity: 0.5, scale: 0.94 }, { opacity: 1, scale: 1.04, duration: D, ease: "sine.inOut" }, 0);
        tl.fromTo("#s8-grain", { x: 0, y: 0 }, { x: -30, y: -20, duration: D, ease: "none" }, 0);

        // The team gathers…
        const XS = [600, 780, 960, 1140, 1320];
        for (let i = 0; i < 5; i++) {
          tl.fromTo("#s8-v" + i, { opacity: 0, scale: 0.3, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "back.out(1.8)" }, 0.2 + i * 0.09);
        }
        // …and converges into the mark.
        for (let i = 0; i < 5; i++) {
          tl.to("#s8-v" + i, { x: 960 - XS[i], y: 0, scale: 0.45, opacity: 0, duration: 0.75, ease: "power3.in" }, 1.55 + Math.abs(i - 2) * 0.06);
