<template id="s3-reports-template">
  <div id="s3-reports" data-composition-id="s3-reports" data-width="1920" data-height="1080" data-duration="15">
    <style>
      @font-face { font-family: "Geist"; src: url("assets/fonts/geist.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Geist Mono"; src: url("assets/fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/instrument-serif.woff2") format("woff2"); font-style: normal; }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/instrument-serif-italic.woff2") format("woff2"); font-style: italic; }

      #s3-reports { position: absolute; inset: 0; overflow: hidden; background: #faf9f5; color: #1a1a1a; font-family: "Geist", sans-serif; }
      #s3-reports .s3-sky { position: absolute; left: -300px; top: -620px; width: 1600px; height: 1100px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 244, 214, 0.9), rgba(250, 238, 206, 0.35) 60%, rgba(250, 249, 245, 0) 100%); }
      #s3-reports .s3-wash { position: absolute; left: 0; right: 0; bottom: 0; height: 420px;
        background: linear-gradient(180deg, rgba(244, 242, 237, 0) 0%, rgba(236, 232, 224, 0.9) 100%); }
      #s3-reports .s3-grain { position: absolute; inset: -40px; opacity: 0.32; mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='23' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.15  0 0 0 0 0.12  0 0 0 0 0.08  0 0 0 0.10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

      #s3-reports .s3-cam { position: absolute; inset: 0; transform-origin: 0 0; }
      #s3-reports .s3-head { position: absolute; left: 0; right: 0; top: 70px; text-align: center; }
      #s3-reports .s3-kicker { font-family: "Geist Mono", monospace; font-size: 22px; letter-spacing: 0.26em; color: #6b675f; }
      #s3-reports .s3-title { font-family: "Instrument Serif", serif; font-size: 88px; line-height: 1.05; letter-spacing: -0.02em; color: #1c1c1c; margin-top: 8px; }
      #s3-reports .s3-title em { font-style: italic; color: #087f4d; }

      #s3-reports .s3-panel { position: absolute; top: 270px; width: 800px; height: 720px; border-radius: 40px; background: #ffffff;
        border: 2px solid rgba(38, 32, 22, 0.10);
        box-shadow: 0 70px 110px -60px rgba(38, 32, 22, 0.45), 0 3px 10px rgba(38, 32, 22, 0.05); overflow: hidden; }
      #s3-reports .s3-pbar { position: absolute; left: 0; right: 0; top: 0; height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        border-bottom: 2px solid rgba(38, 32, 22, 0.06); }
      #s3-reports .s3-pav { width: 72px; height: 72px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 48px; }
      #s3-reports .s3-pname { font-size: 24px; font-weight: 600; margin-top: 8px; color: #1c1c1c; }
      #s3-reports .s3-menu { position: absolute; left: 36px; top: 50px; width: 30px; }
      #s3-reports .s3-menu i { display: block; height: 3px; border-radius: 2px; background: #9d978c; margin-bottom: 7px; }
      #s3-reports .s3-menu i:last-child { width: 20px; }
      #s3-reports .s3-call { position: absolute; right: 34px; top: 44px; width: 36px; height: 36px; color: #9d978c; }

      #s3-reports .s3-thread { position: absolute; left: 40px; right: 40px; top: 186px; }
      #s3-reports .s3-msg { position: absolute; left: 0; max-width: 620px; padding: 22px 28px; border-radius: 30px; font-size: 33px; line-height: 1.3; letter-spacing: -0.01em; }
      #s3-reports .s3-agent { background: #f1eee9; color: #1a1a1a; border-top-left-radius: 10px; transform-origin: 0 0; }
      #s3-reports .s3-user { left: auto; right: 0; background: #1c1c1c; color: #faf9f5; border-top-right-radius: 10px; transform-origin: 100% 0; }
      #s3-reports .s3-typing { position: absolute; left: 0; width: 118px; height: 64px; border-radius: 30px; border-top-left-radius: 10px; background: #f1eee9;
        display: flex; align-items: center; justify-content: center; gap: 10px; }
      #s3-reports .s3-typing i { width: 13px; height: 13px; border-radius: 50%; background: #8c867b; display: block; }
      #s3-reports .s3-files { position: absolute; left: 0; width: 620px; padding: 20px 24px; border-radius: 26px; border: 2px solid rgba(38, 32, 22, 0.10); background: #ffffff; transform-origin: 0 0; }
      #s3-reports .s3-file { display: flex; align-items: center; gap: 14px; font-size: 25px; color: #1a1a1a; height: 44px; }
      #s3-reports .s3-file .ic { width: 34px; height: 40px; border-radius: 7px; background: #fbe9e4; color: #a3360a; font-family: "Geist Mono", monospace; font-size: 11px; font-weight: 700; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px; }
      #s3-reports .s3-file .sz { margin-left: auto; font-family: "Geist Mono", monospace; font-size: 19px; color: #6b675f; }
      #s3-reports .s3-saved { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 14px; border-top: 2px solid rgba(38, 32, 22, 0.06); font-size: 22px; color: #087f4d; font-weight: 520; }
      #s3-reports .s3-saved svg { width: 26px; height: 26px; }
      #s3-reports .s3-react { position: absolute; right: -14px; bottom: -22px; height: 46px; padding: 0 14px; border-radius: 23px; background: #ffffff; border: 2px solid rgba(38, 32, 22, 0.10);
        display: flex; align-items: center; gap: 6px; font-size: 26px; box-shadow: 0 8px 18px -10px rgba(38, 32, 22, 0.4); }
      #s3-reports .s3-time { position: absolute; font-family: "Geist Mono", monospace; font-size: 18px; letter-spacing: 0.08em; color: #6b675f; }
    </style>

    <div class="s3-sky" id="s3-sky"></div>
    <div class="s3-wash"></div>
    <div class="s3-grain" id="s3-grain"></div>

    <div class="s3-cam" id="s3-cam">
      <div class="s3-head" id="s3-head">
        <div class="s3-kicker">8:14 AM</div>
        <div class="s3-title">You wake up to work <em>already done.</em></div>
      </div>

      <!-- Panel A — Billing Clerk -->
      <div class="s3-panel" id="s3-pa" style="left: 120px">
        <div class="s3-menu"><i></i><i></i></div>
        <svg class="s3-call" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/></svg>
        <div class="s3-pbar"><div class="s3-pav" style="background: #fbefd9">🧾</div><div class="s3-pname">Billing Clerk</div></div>
        <div class="s3-thread">
          <div class="s3-time" style="left: 0; top: 0">08:00 · AUTOMATION</div>
          <div class="s3-typing" id="s3-ta" style="top: 40px"><i></i><i></i><i></i></div>
          <div class="s3-msg s3-agent" id="s3-ma" style="top: 40px">Morning! I logged into Acme Billing and pulled September's invoices.</div>
          <div class="s3-files" id="s3-fa" style="top: 222px">
            <div class="s3-file"><span class="ic">PDF</span>INV-2026-0931.pdf<span class="sz">€1,890.00</span></div>
            <div class="s3-file"><span class="ic">PDF</span>INV-2026-0917.pdf<span class="sz">€1,512.00</span></div>
            <div class="s3-file"><span class="ic">PDF</span>INV-2026-0942.pdf<span class="sz">€840.00</span></div>
            <div class="s3-saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>Filed under invoices/2026-09/ · €2,730.00 still open</div>
          </div>
        </div>
      </div>

      <!-- Panel B — Research Analyst -->
      <div class="s3-panel" id="s3-pb" style="left: 1000px">
        <div class="s3-menu"><i></i><i></i></div>
        <svg class="s3-call" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/></svg>
        <div class="s3-pbar"><div class="s3-pav" style="background: #e7effb">🔎</div><div class="s3-pname">Research Analyst</div></div>
        <div class="s3-thread">
          <div class="s3-time" style="left: 0; top: 0">08:09</div>
          <div class="s3-typing" id="s3-tb" style="top: 40px"><i></i><i></i><i></i></div>
          <div class="s3-msg s3-agent" id="s3-mb" style="top: 40px">Northwind cut their Pro plan to $39 overnight. I've written up what it means for us.</div>
          <div class="s3-msg s3-user" id="s3-mu" style="top: 232px">Great — draft a response plan, but check with me before anything goes out.</div>
          <div class="s3-typing" id="s3-tc" style="top: 424px"><i></i><i></i><i></i></div>
          <div class="s3-msg s3-agent" id="s3-mc" style="top: 424px">Will do. It'll be in your inbox by 10.<span class="s3-react" id="s3-rx">👍 <span style="font-size: 20px; font-family: 'Geist Mono', monospace; color: #6b675f">1</span></span></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const D = 15;

        tl.fromTo("#s3-sky", { opacity: 0.6, x: -40 }, { opacity: 1, x: 90, duration: D, ease: "sine.inOut" }, 0);
        tl.fromTo("#s3-grain", { x: 0, y: 0 }, { x: -30, y: -30, duration: D, ease: "none" }, 0);

        // Headline + panels rise in.
        tl.fromTo("#s3-head", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.1);
        tl.fromTo("#s3-pa", { opacity: 0, y: 90, rotation: -1.2 }, { opacity: 1, y: 0, rotation: 0, duration: 1.0, ease: "power3.out" }, 0.35);
        tl.fromTo("#s3-pb", { opacity: 0, y: 90, rotation: 1.2 }, { opacity: 1, y: 0, rotation: 0, duration: 1.0, ease: "power3.out" }, 0.55);

        // Typing dots: phase-offset pulses, killed the instant the message lands.
        function typing(sel, start, end) {
          tl.fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, start);
          const dots = document.querySelectorAll(sel + " i");
          const n = Math.max(1, Math.floor((end - start - 0.3) / 0.5));
          dots.forEach(function (d, k) {
            tl.fromTo(d, { y: 0, opacity: 0.45 }, { y: -8, opacity: 1, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1 }, start + 0.3 + k * 0.12);
          });
          tl.set(sel, { opacity: 0 }, end);
        }
        function pop(sel, t) {
          tl.fromTo(sel, { opacity: 0, scale: 0.85, y: 16 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "back.out(1.5)" }, t);
        }

        // Panel A — the routine already ran.
        typing("#s3-ta", 1.3, 2.3);
        pop("#s3-ma", 2.3);
        pop("#s3-fa", 3.3);
        tl.fromTo("#s3-fa .s3-file", { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out", stagger: 0.12 }, 3.5);
        tl.fromTo("#s3-fa .s3-saved", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 4.0);

        // Panel B — a finding, your reply, its acknowledgement.
        typing("#s3-tb", 4.4, 5.4);
        pop("#s3-mb", 5.4);
        pop("#s3-mu", 7.3);
        typing("#s3-tc", 9.2, 10.2);
        pop("#s3-mc", 10.2);
        tl.fromTo("#s3-rx", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.4)" }, 11.3);

        // Camera: settle, then ONE push-in onto the thread's confirmation.
        tl.fromTo("#s3-cam", { x: 0, y: 0, scale: 1 }, { x: -10, y: -6, scale: 1.01, duration: 6.2, ease: "none" }, 0);
        tl.to("#s3-cam", { x: -1308, y: -659, scale: 1.62, duration: 3.2, ease: "power3.inOut" }, 6.4);
        tl.to("#s3-cam", { x: -1335, y: -690, scale: 1.66, duration: 4.7, ease: "none" }, 9.7);

        // Dip to paper.
        tl.to("#s3-cam", { opacity: 0, filter: "blur(12px)", duration: 0.55, ease: "power2.in" }, D - 0.6);

        window.__timelines["s3-reports"] = tl;
      })();
    </script>
  </div>
</template>
