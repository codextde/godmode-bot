[package]
name = "godmode-bot"
version = "0.1.0"
description = "Godmode Bot — an open-source AI coworker that works in your browser with your logins, 2FA and tools."
authors = ["Codext GmbH"]
license-file = "../../../LICENSE"
repository = "https://github.com/codextde/godmode-bot"
homepage = "https://godmode.codext.de"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
# Desktop only: the library exists so `main.rs` stays a thin entry point.
name = "godmode_bot_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.4.0"
tauri-plugin-notification = "2.5.0"
tauri-plugin-opener = "2.6.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-autostart = "2.6.0"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-single-instance = "2.5.0"
tauri-plugin-updater = "2.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Proc-macro dylibs are loaded by rustc itself; stripping them makes `tauri_macros` unloadable on macOS.
[profile.release.build-override]
strip = false
