[package]
name = "godmode-bot"
version = "0.2.47"
description = "Godmode Bot — an AI coworker that works in your browser with your logins, 2FA and tools."
authors = ["Codext GmbH"]
license = "MIT"
repository = "https://github.com/codextde/godmode-bot"
homepage = "https://usegodmode.com"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
# Desktop only: the library exists so `main.rs` stays a thin entry point.
name = "godmode_bot_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-shell = "2.6.0"
tauri-plugin-notification = "2.8.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-updater = "2.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
base64 = "0.23"
semver = "1"
tar = "0.4"
flate2 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKPreferences", "WKWebViewConfiguration"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Proc-macro dylibs are loaded by rustc itself; stripping them makes `tauri_macros` unloadable on macOS.
[profile.release.build-override]
strip = false
