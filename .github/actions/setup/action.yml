name: Setup toolchain
description: pnpm (with store cache), Node.js, Bun and the workspace dependencies.

inputs:
  bun-version:
    description: Bun version used to run and compile the core.
    default: "1.4.2"
  install:
    description: Run `pnpm install --frozen-lockfile`.
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.1.0
      with:
        cache: true
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
