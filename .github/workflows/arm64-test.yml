name: arm64 appimage test
on:
  push:
    branches: [fix/linux-arm64-appimage]
jobs:
  build:
    runs-on: ubuntu-22.04-arm
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, fixed]
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev
          dpkg -l | grep -i fuse || true
          ls /dev/fuse || true
      - if: matrix.variant == 'fixed'
        run: |
          sudo apt-get install -y libfuse2 xdg-utils file
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          echo "NO_STRIP=true" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: aarch64-unknown-linux-gnu
      - working-directory: packages/core
        run: bun run scripts/build.ts --sidecar --target=bun-linux-arm64 --smoke
      - working-directory: apps/desktop
        run: pnpm tauri build --verbose --bundles appimage
