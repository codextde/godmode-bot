name: Release

# Push a tag (v0.2.4) to build it. Every job builds with the tag's version, so the version files don't have to be
# bumped first; when the tag is ahead of main, main gets a "Release v0.2.4" commit (`pnpm bump` does the same locally).
# The tag builds:
#   * desktop installers (macOS arm64 + x64, Windows x64, Linux x64 + arm64) with the core sidecar,
#   * standalone `godmode` server binaries (web dashboard embedded),
#   * the Docker image ghcr.io/codextde/godmode-bot,
# all attached to a draft GitHub release that a maintainer publishes after a quick check. The last job drops the .sig
# files (latest.json carries the signatures), adds SHA256SUMS and puts a download table on top of the notes.
#
# Secrets for signed + notarized macOS builds (Developer ID Application: Codext GmbH): APPLE_CERTIFICATE (base64 .p12),
# APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_TEAM_ID and for notarization either an App Store Connect
# API key (APPLE_API_ISSUER, APPLE_API_KEY = key id, APPLE_API_KEY_P8 = contents of the .p8) or APPLE_ID + APPLE_PASSWORD.
#
# Required secrets for auto-update: TAURI_SIGNING_PRIVATE_KEY + TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the key matching
# `plugins.updater.pubkey` in tauri.conf.json). They sign the update bundles and add latest.json to the release;
# installed apps pick the update up once the release is published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v0.1.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # Official builds check for a Godmode Pro licence; builds from source and of your own don't (MIT).
  GODMODE_OFFICIAL_BUILD: "1"

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Read the version from the tag
        id: version
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a version tag (vX.Y.Z)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Bump main when the tag is ahead of it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then exit 0; fi
          git fetch --no-tags --depth=1 origin main
          git checkout -q -B release-bump FETCH_HEAD
          current=$(node -p "require('./apps/desktop/package.json').version")
          newest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n1)
          if [ "$current" = "$VERSION" ] || [ "$newest" != "$VERSION" ]; then
            echo "main is at $current, nothing to bump"
            exit 0
          fi
          bun scripts/bump-version.ts "$VERSION"
          git -c user.name="Daniel Ehrhardt" -c user.email="daniel.ehrhardt@codext.de" commit -qam "Release v$VERSION"
          git push origin HEAD:main || echo "::warning::could not push the version bump to main, run 'pnpm bump $VERSION' there"

      - name: Check the updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Without latest.json in a published release every installed app's update check fails.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets (see the top of release.yml)."
            exit 1
          fi

      - name: Create (or reuse) the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            prerelease=false
            if [[ "$TAG" == *-* ]]; then prerelease=true; fi
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="Godmode Bot $TAG" \
              -F draft=true -F prerelease="$prerelease" \
              -F generate_release_notes=true --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            bun_target: bun-darwin-arm64
            args: --target aarch64-apple-darwin
          - name: macOS x64
            os: macos-latest
            rust_target: x86_64-apple-darwin
            bun_target: bun-darwin-x64
            args: --target x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bun_target: bun-windows-x64
            args: ""
          - name: Linux x64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bun_target: bun-linux-x64
            args: ""
          - name: Linux arm64
            os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            bun_target: bun-linux-arm64
            args: ""
            skip_sidecar_rpath: true
    steps:
      - name: Check out with LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev

      - uses: ./.github/actions/setup

      - name: Set the version from the tag
        shell: bash
        run: bun scripts/bump-version.ts "$TAG"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.rust_target }}

      - name: Build the core sidecar
        working-directory: packages/core
        run: bun run scripts/build.ts --sidecar --target=${{ matrix.bun_target }} --smoke

      - name: Enable macOS signing when secrets are configured
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # Exported only when set: empty values would make the bundler try (and fail) to import a certificate.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              { echo "$name<<__GODMODE_EOF__"; echo "$value"; echo "__GODMODE_EOF__"; } >> "$GITHUB_ENV"
            fi
          done
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          fi
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::macOS build is not signed with a Developer ID (APPLE_CERTIFICATE missing): Gatekeeper will block it"
          fi

      - name: Keep linuxdeploy from patching the sidecar
        if: matrix.skip_sidecar_rpath
        run: |
          # linuxdeploy sets an rpath on every ELF file in the AppImage. On arm64 that rewrite makes the Bun-compiled
          # sidecar segfault and ldd fail, which aborts the build. The sidecar only links libc, so it needs no rpath.
          wrapper="$RUNNER_TEMP/patchelf"
          cat > "$wrapper" <<'EOF'
          #!/usr/bin/env bash
          if [ "${1:-}" = "--set-rpath" ] && [[ "${!#}" == */godmode-core ]]; then exit 0; fi
          exec /usr/bin/patchelf "$@"
          EOF
          chmod +x "$wrapper"
          echo "PATCHELF=$wrapper" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 1

      - name: Check the macOS signature and notarization
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        run: |
          app=$(ls -d apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/*.app | head -n1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -E "Authority=Developer ID Application|TeamIdentifier"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

  updater-manifest:
    name: Check latest.json
    needs: [create-release, desktop]
    runs-on: ubuntu-latest
    steps:
      # The desktop jobs merge their platform into latest.json in parallel; a lost race drops a platform silently.
      - name: Every desktop platform is in latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq '.[] | select(.name == "latest.json") | .id')
          if [ -z "$id" ]; then
            echo "::error::latest.json is missing from the release"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > latest.json
          missing=0
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64 linux-aarch64; do
            if ! jq -e --arg p "$platform" '.platforms[$p].url' latest.json > /dev/null; then
              echo "::error::latest.json has no $platform entry: re-run that platform's desktop job"
              missing=1
            fi
          done
          jq '.platforms | keys' latest.json
          exit "$missing"

      - name: Point latest.json at the download URLs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          # tauri-action writes API asset URLs (a draft has no download URLs yet). Download URLs work once the release
          # is published and use no API quota, which the website's update feed runs out of.
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100")
          jq --argjson assets "$assets" --arg base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" '
            ($assets | map({key: (.id | tostring), value: .name}) | from_entries) as $names
            | .platforms |= map_values(.url |= (if test("/releases/assets/[0-9]+$") then $base + ($names[split("/") | last] | @uri) else . end))
          ' latest.json > latest.rewritten.json
          jq -r '.platforms[].url' latest.rewritten.json | sort -u
          id=$(jq -r '.[] | select(.name == "latest.json") | .id' <<< "$assets")
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
          gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=latest.json" \
            -H "Content-Type: application/json" --input latest.rewritten.json --jq .browser_download_url

  server:
    name: Server binaries (${{ matrix.os }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on Linux: Linux + Windows. macOS binaries are built (and signed ad hoc) on macOS.
          - os: ubuntu-latest
            targets: bun-linux-x64 bun-linux-x64-baseline bun-linux-arm64 bun-windows-x64
          - os: macos-latest
            targets: bun-darwin-arm64 bun-darwin-x64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: ./.github/actions/setup

      - name: Set the version from the tag
        shell: bash
        run: bun scripts/bump-version.ts "$TAG"

      - name: Build web UI
        run: pnpm --filter @godmode/desktop build

      - name: Build standalone binaries
        working-directory: packages/core
        run: |
          for target in ${{ matrix.targets }}; do
            bun run scripts/build.ts --target="$target" --smoke
          done

      - name: Upload to the draft release
        working-directory: packages/core/bin
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          for f in godmode-*; do
            # Replace an asset from a previous attempt of this workflow.
            old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq ".[] | select(.name == \"$f\") | .id")
            if [ -n "$old" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"; fi
            gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$f" \
              -H "Content-Type: application/octet-stream" --input "$f" --jq .browser_download_url
          done

  downloads:
    name: Download table
    needs: [create-release, updater-manifest, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Tidy the assets and put the download table on top of the notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          release="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          gh api "$release/assets?per_page=100" --jq '.[] | select(.name | test("\\.(sig|sha256)$") or . == "SHA256SUMS") | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"; done
          gh api "$release/assets?per_page=100" > assets.json
          bun scripts/release-downloads.ts sums assets.json > SHA256SUMS
          gh api -X POST "https://uploads.github.com/$release/assets?name=SHA256SUMS" \
            -H "Content-Type: text/plain" --input SHA256SUMS --jq .browser_download_url
          gh api "$release/assets?per_page=100" > assets.json
          gh api "$release" --jq '.body // ""' > body.md
          bun scripts/release-downloads.ts notes "$TAG" assets.json body.md > notes.md
          # Without tag_name GitHub detaches a draft from its tag ("untagged-..."), and it can no longer be published.
          gh api -X PATCH "$release" -f tag_name="$TAG" -F body=@notes.md --jq .html_url
          jq -r '.[].name' assets.json

  docker:
    name: Docker image
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Set the version from the tag
        run: bun scripts/bump-version.ts "$TAG"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/codextde/godmode-bot
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
          labels: |
            org.opencontainers.image.title=Godmode Bot
            org.opencontainers.image.description=Godmode Bot headless server with the web dashboard, Chromium, uv and Claude Code
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GODMODE_OFFICIAL_BUILD=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
