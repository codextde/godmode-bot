name: Verify macOS downloads

# What a Mac user gets from usegodmode.com and the in-app updater must open without a Gatekeeper prompt:
# Developer ID Application: Codext GmbH, notarized, stapled. Runs every morning and after each published release;
# a failure opens (or updates) an issue so a broken signature never stays unnoticed.

on:
  schedule:
    - cron: "17 5 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: Gatekeeper check
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download what users download
        run: |
          mkdir -p "$RUNNER_TEMP/dl" && cd "$RUNNER_TEMP/dl"
          # The website picks the latest published release; a release event may beat its five-minute cache.
          if [ "${{ github.event_name }}" = release ]; then sleep 360; fi
          for platform in mac mac-intel; do
            curl -fsSL --retry 3 -o "$platform.dmg" "https://usegodmode.com/download/$platform"
          done
          for platform in server-macos-arm64 server-macos-x64; do
            curl -fsSL --retry 3 -o "godmode-$platform" "https://usegodmode.com/download/$platform"
            chmod +x "godmode-$platform"
          done
          curl -fsSL --retry 3 -o latest.json "https://usegodmode.com/api/update/latest.json" ||
            gh release download --repo "$GITHUB_REPOSITORY" --pattern latest.json --clobber
          for arch in darwin-aarch64 darwin-x86_64; do
            url=$(jq -r --arg p "$arch" '.platforms[$p].url' latest.json)
            curl -fsSL --retry 3 -o "update-$arch.app.tar.gz" "$url"
          done
          # Mark everything as downloaded by a browser, like a user's copy.
          for f in *; do xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;" "$f"; done
          ls -la
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check signatures and notarization
        run: scripts/macos-verify.sh "$RUNNER_TEMP"/dl/*.dmg "$RUNNER_TEMP"/dl/*.app.tar.gz "$RUNNER_TEMP"/dl/godmode-server-*

      - name: Open an issue when a download is broken
        if: failure() && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="macOS downloads fail the Gatekeeper check"
          body="The [Verify macOS downloads]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) run found a download that macOS would refuse to open. Check the log, fix the signing (see the top of release.yml) and re-run the release."
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
